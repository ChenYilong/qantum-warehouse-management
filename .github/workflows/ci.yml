name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The supplied catalogue is kept out of the public repo; restore it from a secret and check its hash.
      - name: Restore catalogue CSV from secret
        env:
          SOLUTIONS_CSV_B64: ${{ secrets.SOLUTIONS_CSV_B64 }}
        run: |
          test -n "$SOLUTIONS_CSV_B64" || { echo "::error::Secret SOLUTIONS_CSV_B64 is missing"; exit 1; }
          printf '%s' "$SOLUTIONS_CSV_B64" | base64 -d > data/solutions-excerpt.csv
          echo "cc01d2ab3fd65a29d95ef42fd04648682e116b1142700300fab9074a30b5e805  data/solutions-excerpt.csv" | sha256sum -c -
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle credential scan
        run: REQUIRE_BUNDLE_SCAN=1 npx vitest run tests/api/security.test.ts
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database contract
        env:
          TEST_DB_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          REQUIRE_DB_CONTRACT: "1"
        run: npm run test:db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore catalogue CSV from secret
        env:
          SOLUTIONS_CSV_B64: ${{ secrets.SOLUTIONS_CSV_B64 }}
        run: |
          test -n "$SOLUTIONS_CSV_B64" || { echo "::error::Secret SOLUTIONS_CSV_B64 is missing"; exit 1; }
          printf '%s' "$SOLUTIONS_CSV_B64" | base64 -d > data/solutions-excerpt.csv
          echo "cc01d2ab3fd65a29d95ef42fd04648682e116b1142700300fab9074a30b5e805  data/solutions-excerpt.csv" | sha256sum -c -
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:ac
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy:
    needs: [checks, db, e2e]
    # Deploy only from main, and only once the Vercel project is configured (repository variable VERCEL_PROJECT_ID).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployment secrets live in the protected "production" environment, as in qantum-stock.
    environment: production
    concurrency:
      group: deploy-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore catalogue CSV from secret
        env:
          SOLUTIONS_CSV_B64: ${{ secrets.SOLUTIONS_CSV_B64 }}
        run: |
          test -n "$SOLUTIONS_CSV_B64" || { echo "::error::Secret SOLUTIONS_CSV_B64 is missing"; exit 1; }
          printf '%s' "$SOLUTIONS_CSV_B64" | base64 -d > data/solutions-excerpt.csv
          echo "cc01d2ab3fd65a29d95ef42fd04648682e116b1142700300fab9074a30b5e805  data/solutions-excerpt.csv" | sha256sum -c -
      - run: npx vercel@62.2.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Check the Mapbox token
        # The project maps (AC 74 to 76) need a public Mapbox token (pk.). Without one the deploy has no maps and
        # nothing else changes; a token that is not public stops the deploy, so a secret token never reaches a page.
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
            echo "::warning::Secret MAPBOX_PUBLIC_TOKEN is not set, so this deploy has no project maps. Set a public Mapbox token (pk.) once: gh secret set MAPBOX_PUBLIC_TOKEN"
            exit 0
          fi
          case "$MAPBOX_PUBLIC_TOKEN" in
            pk.*) echo "A public Mapbox token is set." ;;
            *)
              echo "::error::Secret MAPBOX_PUBLIC_TOKEN is not a public Mapbox token (pk.), so nothing was deployed. Never use a secret token (sk.) here."
              exit 1
              ;;
          esac
      - name: Build
        # next.config.ts bakes the public token into the server code only (no NEXT_PUBLIC_ name) and fails on sk.
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: npx vercel@62.2.0 build --prod --token "$VERCEL_TOKEN"
      - name: Migrate the production database
        # After the build and before the deploy, so a failed build never touches the database. Migrations only add
        # (tables, columns with defaults, wider checks), so the version still live keeps working until the deploy.
        # Fail closed: without the admin password nothing is deployed, since the new code may need a new table.
        # Host, admin user and database come from the Vercel production settings pulled above: DB_HOST, DB_USER
        # (qantum_slice.<project-ref>, so the admin is postgres.<project-ref>) and DB_NAME, on the session pooler
        # (port 5432). Repository or environment variables MIGRATION_DB_HOST and MIGRATION_DB_USER override them.
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MIGRATION_DB_HOST: ${{ vars.MIGRATION_DB_HOST }}
          MIGRATION_DB_USER: ${{ vars.MIGRATION_DB_USER }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD is missing, so nothing was deployed. Set the Supabase database password once: gh secret set SUPABASE_DB_PASSWORD --env production"
            exit 1
          fi
          pulled=.vercel/.env.production.local
          # Never fails: a missing file or key is an empty value, reported below (steps run with -e -o pipefail).
          pulled_value() { { grep -m 1 "^$1=" "$pulled" 2>/dev/null || true; } | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          host="${MIGRATION_DB_HOST:-$(pulled_value DB_HOST)}"
          name="$(pulled_value DB_NAME)"
          user="$MIGRATION_DB_USER"
          app_user="$(pulled_value DB_USER)"
          if [ -z "$user" ] && [ "${app_user#*.}" != "$app_user" ]; then
            ref="${app_user##*.}"
            case "$ref" in ''|*[!a-z0-9]*) ;; *) user="postgres.$ref" ;; esac
          fi
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "::error::Can't tell the database host or admin user from the Vercel production settings, so nothing was deployed. Set the variables MIGRATION_DB_HOST and MIGRATION_DB_USER (postgres.<project-ref>)."
            exit 1
          fi
          DB_HOST="$host" DB_PORT=5432 DB_USER="$user" DB_PASSWORD="$SUPABASE_DB_PASSWORD" DB_NAME="${name:-qantum_slice}" DB_SSL=require npm run db:migrate
      - run: npx vercel@62.2.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Smoke
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs
